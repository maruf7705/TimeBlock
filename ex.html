<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Add &amp; View Time Blocks</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4F46E5", // Indigo-600
                        primaryLight: "#818CF8", // Indigo-400
                        "background-light": "#F3F4F6", // Gray-100
                        "background-dark": "#111827", // Gray-900
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1F2937", // Gray-800
                        "text-secondary-light": "#6B7280", // Gray-500
                        "text-secondary-dark": "#9CA3AF", // Gray-400
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': '1rem',
                        '2xl': '1.5rem',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 4px 14px 0 rgba(79, 70, 229, 0.4)',
                    }
                },
            },
        };
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }

        .dark input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-sans text-gray-900 dark:text-white min-h-screen flex justify-center selection:bg-primary selection:text-white transition-colors duration-200">
    <div
        class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative overflow-hidden">
        <div class="h-12 w-full flex items-center justify-between px-6 pt-2">
            <span
                class="text-xs font-semibold tracking-wider text-text-secondary-light dark:text-text-secondary-dark">9:41</span>
            <div class="flex space-x-2">
                <span class="material-icons-round text-xs text-text-secondary-light dark:text-text-secondary-dark"
                    style="font-size: 16px;">signal_cellular_alt</span>
                <span class="material-icons-round text-xs text-text-secondary-light dark:text-text-secondary-dark"
                    style="font-size: 16px;">wifi</span>
                <span class="material-icons-round text-xs text-text-secondary-light dark:text-text-secondary-dark"
                    style="font-size: 16px;">battery_full</span>
            </div>
        </div>
        <div
            class="bg-surface-light dark:bg-surface-dark shadow-sm rounded-b-2xl mx-4 mt-2 px-1 py-1 flex items-center justify-between relative z-10 border border-gray-100 dark:border-gray-700">
            <button
                class="flex-1 py-2.5 rounded-xl bg-primary/10 text-primary font-semibold text-sm transition-all text-center">
                Tasks
            </button>
            <button
                class="flex-1 py-2.5 rounded-xl text-text-secondary-light dark:text-text-secondary-dark font-medium text-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-all text-center">
                Calendar
            </button>
            <button
                class="flex-1 py-2.5 rounded-xl text-text-secondary-light dark:text-text-secondary-dark font-medium text-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-all text-center">
                Profile
            </button>
        </div>
        <main class="flex-1 overflow-y-auto px-6 py-6 pb-24 scroll-smooth">
            <div class="flex space-x-4 mb-6">
                <div class="flex-1 group">
                    <label
                        class="block text-xs font-semibold text-text-secondary-light dark:text-text-secondary-dark uppercase tracking-wide mb-2 pl-1">Start</label>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3.5 text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all shadow-sm font-medium"
                            type="time" value="09:00" />
                    </div>
                </div>
                <div class="flex-1 group">
                    <label
                        class="block text-xs font-semibold text-text-secondary-light dark:text-text-secondary-dark uppercase tracking-wide mb-2 pl-1">End</label>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3.5 text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all shadow-sm font-medium"
                            type="time" value="10:30" />
                    </div>
                </div>
            </div>
            <div class="mb-6">
                <label
                    class="block text-xs font-semibold text-text-secondary-light dark:text-text-secondary-dark uppercase tracking-wide mb-2 pl-1">Description</label>
                <div class="relative">
                    <textarea
                        class="w-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all shadow-sm resize-none"
                        placeholder="What are you focusing on?" rows="3"></textarea>
                    <div class="absolute top-3 right-3 pointer-events-none">
                        <span class="material-icons-round text-gray-300 dark:text-gray-600 text-sm">edit</span>
                    </div>
                </div>
            </div>
            <div class="mb-8">
                <label
                    class="block text-xs font-semibold text-text-secondary-light dark:text-text-secondary-dark uppercase tracking-wide mb-2 pl-1">Notes</label>
                <div class="relative">
                    <textarea
                        class="w-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all shadow-sm resize-none"
                        placeholder="Add extra context, links or subtasks..." rows="3"></textarea>
                </div>
            </div>
            <button
                class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-glow active:transform active:scale-[0.98] transition-all flex items-center justify-center space-x-2 group">
                <span
                    class="material-icons-round text-xl group-hover:rotate-90 transition-transform duration-300">add</span>
                <span>Add Time Block</span>
            </button>
            <div class="my-8 flex items-center space-x-4">
                <div class="h-px bg-gray-200 dark:bg-gray-800 flex-1"></div>
                <span class="text-xs font-medium text-gray-400 uppercase tracking-widest">Overview</span>
                <div class="h-px bg-gray-200 dark:bg-gray-800 flex-1"></div>
            </div>
            <div
                class="bg-surface-light dark:bg-surface-dark rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-soft flex items-center justify-between group cursor-pointer hover:border-primary/30 transition-colors">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-primary uppercase tracking-wider mb-1">Today</span>
                    <h2
                        class="text-xl font-bold text-gray-900 dark:text-white group-hover:text-primary transition-colors">
                        Time Blocks</h2>
                    <span class="text-xs text-text-secondary-light dark:text-text-secondary-dark mt-1">4h 30m
                        scheduled</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex -space-x-2 overflow-hidden">
                        <div
                            class="inline-block h-8 w-8 rounded-full ring-2 ring-white dark:ring-gray-800 bg-blue-400 flex items-center justify-center text-xs font-bold text-white">
                            W</div>
                        <div
                            class="inline-block h-8 w-8 rounded-full ring-2 ring-white dark:ring-gray-800 bg-pink-400 flex items-center justify-center text-xs font-bold text-white">
                            G</div>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
                        <span class="font-bold text-gray-900 dark:text-white text-sm">3</span>
                    </div>
                </div>
            </div>
        </main>
        <div
            class="absolute bottom-0 w-full bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 pb-6 pt-2 px-6 flex justify-around items-center z-20">
            <button class="p-2 rounded-full text-primary">
                <span class="material-icons-round text-2xl">home</span>
            </button>
            <button
                class="p-2 rounded-full text-text-secondary-light dark:text-text-secondary-dark hover:text-gray-900 dark:hover:text-white transition-colors">
                <span class="material-icons-round text-2xl">grid_view</span>
            </button>
            <div class="w-12"></div>
            <button
                class="p-2 rounded-full text-text-secondary-light dark:text-text-secondary-dark hover:text-gray-900 dark:hover:text-white transition-colors">
                <span class="material-icons-round text-2xl">insert_chart</span>
            </button>
            <button
                class="p-2 rounded-full text-text-secondary-light dark:text-text-secondary-dark hover:text-gray-900 dark:hover:text-white transition-colors">
                <span class="material-icons-round text-2xl">settings</span>
            </button>
        </div>
    </div>

</body>

</html>
